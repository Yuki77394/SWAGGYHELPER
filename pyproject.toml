[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SWAGGYMUSIC"
version = "0.2.0"
description = "🚩 Standalone Telegram channel-management utility bot — Auto Delete, Post Gap Control, Create Post (built on the SWAGGYMUSIC / Kurigram architecture)."
readme = "README.md"

requires-python = ">=3.11,<3.13"

license = { text = "MIT" }

authors = [
  { name = "SWAGGYMUSIC" }
]

keywords = ["telegram", "bot", "channel-management", "pyrogram", "kurigram", "auto-delete", "post-gap"]

classifiers = [
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Utilities",
]

dependencies = [
  "aiohttp>=3.9.5",
  "GitPython>=3.1.43",
  "humanize>=4.9.0",
  "python-dotenv==1.2.2",
  "pyyaml>=6.0.1",
  "kurigram[fast]==2.2.25",
  "motor>=3.4.0",
  "psutil>=5.9.8",
  "heroku3>=5.2.1",
  "Pillow==12.1.1",
]

[tool.setuptools.packages.find]
include = ["SWAGGYMUSIC*", "strings*"]

[tool.setuptools]
py-modules = ["config"]

[project.urls]
Repository = "https://github.com/Yuki77394/SWAGGYHELPER"
Issues = "https://github.com/Yuki77394/SWAGGYHELPER/issues"

[project.scripts]
swaggymusic = "SWAGGYMUSIC.__main__:main"
